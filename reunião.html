<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <title>Baixar Google Meet</title>

  <style>
    *{
      box-sizing:border-box;
      margin:0;
      padding:0;
    }

    html, body{
      width:100%;
      min-height:100%;
    }

    body{
      font-family:Arial, Helvetica, sans-serif;
      background:#ffffff;
      display:flex;
      justify-content:center;
      align-items:center;
      min-height:100dvh;
      padding:20px;
    }

    .pagina{
      width:100%;
      max-width:900px;
      text-align:center;
    }

    .imagem{
      display:block;
      width:100%;
      max-width:900px;
      height:auto;
      max-height:75dvh;
      object-fit:contain;
      margin:0 auto 24px;
      border-radius:12px;
    }

    .botoes{
      display:flex;
      justify-content:center;
      align-items:center;
      gap:14px;
      flex-wrap:wrap;
    }

    .botao{
      display:flex;
      align-items:center;
      justify-content:center;
      min-height:52px;
      padding:13px 24px;
      border-radius:12px;
      background:#2aa449;
      color:#ffffff;
      text-decoration:none;
      font-size:17px;
      font-weight:800;
      box-shadow:0 5px 14px rgba(0,0,0,.18);
      transition:transform .15s ease, background .15s ease;
    }

    .botao:hover{
      background:#218b3d;
      transform:translateY(-2px);
    }

    .botao:active{
      transform:scale(.97);
    }

    @media (max-width:600px){
      body{
        padding:12px;
      }

      .imagem{
        max-height:none;
        margin-bottom:18px;
        border-radius:8px;
      }

      .botoes{
        flex-direction:column;
        width:100%;
      }

      .botao{
        width:100%;
        max-width:420px;
        min-height:50px;
        font-size:16px;
      }
    }
  </style>
</head>

<body>

  <main class="pagina">

    <!--
      Coloque no GitHub, na mesma pasta deste HTML,
      a imagem com exatamente este nome:
      imagem reuniao.png
    -->
    <img
      class="imagem"
      src="imagem%20reuniao.png"
      alt="Informações sobre o Google Meet e reunião">

    <div class="botoes">

      <a
        class="botao"
        href="https://apps.apple.com/br/app/google-meet/id1096918571"
        target="_blank"
        rel="noopener noreferrer">
        Baixar no iOS
      </a>

      <a
        class="botao"
        href="https://play.google.com/store/apps/details?id=com.google.android.apps.tachyon&hl=pt_BR&pli=1"
        target="_blank"
        rel="noopener noreferrer">
        Baixar no Android
      </a>

    </div>

  </main>

</body>
</html>
