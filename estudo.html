<style>

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html{
  width:100%;
  min-height:100%;
}

body{
  font-family:Arial,sans-serif;
  background:#ffffff;
  min-height:100vh;
  min-height:100dvh;
  overflow-x:hidden;
  -webkit-text-size-adjust:100%;
}

/* =====================================================
   PESQUISA GOOGLE
   ===================================================== */

.google-search{
  display:flex;
  justify-content:center;
  width:100%;
  padding:10px 14px 0;
}

.google-search form{
  display:flex;
  width:100%;
  max-width:600px;
  height:46px;
}

.google-search input{
  flex:1;
  min-width:0;
  padding:0 16px;

  border:1px solid #d0d0d0;
  border-right:none;

  border-radius:24px 0 0 24px;

  outline:none;

  font-size:16px;

  box-shadow:0 2px 6px rgba(0,0,0,.10);

  -webkit-appearance:none;
  appearance:none;
}

.google-search input:focus{
  border-color:#2aa449;
  box-shadow:0 2px 8px rgba(42,164,73,.25);
}

.google-search button{
  width:58px;
  flex-shrink:0;

  border:none;

  border-radius:0 24px 24px 0;

  background:#2aa449;
  color:#fff;

  font-size:18px;

  cursor:pointer;

  box-shadow:0 2px 6px rgba(0,0,0,.10);

  -webkit-tap-highlight-color:transparent;
}

.google-search button:hover{
  background:#218b3d;
}

/* =====================================================
   CABEÇALHO
   ===================================================== */

header{
  text-align:center;
  padding:24px 10px 14px;
}

.logo{
  width:180px;
  max-width:70vw;
  height:auto;
  display:block;
  margin:0 auto 10px;
}

/* =====================================================
   PLAYER RÁDIO
   ===================================================== */

.radio-player{
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:10px;
  margin-bottom:12px;
}

.radio-btn{
  width:72px;
  height:72px;

  border-radius:50%;
  border:none;

  background:#2aa449;
  color:#ffffff;

  font-size:28px;

  cursor:pointer;

  display:flex;
  align-items:center;
  justify-content:center;

  box-shadow:0 6px 16px rgba(0,0,0,.25);

  transition:
    transform .15s ease,
    box-shadow .15s ease;

  -webkit-tap-highlight-color:transparent;
}

.radio-btn:hover{
  transform:scale(1.05);
  box-shadow:0 10px 22px rgba(0,0,0,.3);
}

.radio-btn:active{
  transform:scale(.96);
}

.radio-title{
  font-size:15px;
  font-weight:900;
  color:#2aa449;
}

.title{
  font-size:22px;
  font-weight:900;
  color:#2aa449;
}

/* =====================================================
   CARDS
   ===================================================== */

.wrap{
  padding:14px;
  width:100%;
  max-width:1200px;
  margin:auto;
}

.grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:12px;
}

@media(min-width:560px){

  .grid{
    grid-template-columns:repeat(3,1fr);
  }

}

@media(min-width:860px){

  .grid{
    grid-template-columns:repeat(4,1fr);
  }

}

.card{
  background:#2aa449;

  border-radius:18px;

  padding:20px 10px;

  display:flex;
  flex-direction:column;
  align-items:center;

  gap:12px;

  cursor:pointer;

  transition:
    transform .15s ease,
    box-shadow .15s ease;

  -webkit-tap-highlight-color:transparent;

  user-select:none;
}

.card:hover{
  transform:scale(1.03);
  box-shadow:0 10px 22px rgba(0,0,0,.15);
}

.card:active{
  transform:scale(.98);
}

.iconBox{
  width:64px;
  height:64px;

  border-radius:20px;

  background:rgba(255,255,255,.25);

  display:flex;
  align-items:center;
  justify-content:center;

  flex-shrink:0;
}

.iconBox i{
  font-size:30px;
  color:#ffffff;
}

.iconSvg{
  width:34px;
  height:34px;
}

.iconStroke{
  fill:none;
  stroke:#ffffff;
  stroke-width:2.6;
  stroke-linejoin:round;
  stroke-linecap:round;
}

.label{
  font-size:14px;
  font-weight:900;
  color:#ffffff;
  text-align:center;
}

/* =====================================================
   POPUP DE INSTALAÇÃO PWA
   ===================================================== */

.pwa-overlay{

  position:fixed;

  inset:0;

  width:100%;
  height:100%;

  background:rgba(0,0,0,.62);

  display:none;

  align-items:center;
  justify-content:center;

  padding:18px;

  z-index:99999;

  backdrop-filter:blur(4px);
  -webkit-backdrop-filter:blur(4px);
}

.pwa-popup{

  width:100%;
  max-width:430px;

  background:#ffffff;

  border-radius:24px;

  padding:24px 20px 20px;

  box-shadow:
    0 20px 60px rgba(0,0,0,.30);

  text-align:center;

  animation:pwaEntrada .25s ease;

  max-height:90vh;
  overflow-y:auto;
}

@keyframes pwaEntrada{

  from{
    opacity:0;
    transform:translateY(25px) scale(.96);
  }

  to{
    opacity:1;
    transform:translateY(0) scale(1);
  }

}

.pwa-icon{

  width:82px;
  height:82px;

  object-fit:contain;

  margin:0 auto 12px;

  border-radius:18px;

  box-shadow:0 5px 15px rgba(0,0,0,.15);
}

.pwa-popup h2{

  color:#2aa449;

  font-size:21px;

  margin-bottom:10px;

  font-weight:900;
}

.pwa-popup p{

  color:#444;

  font-size:15px;

  line-height:1.5;

  margin-bottom:14px;
}

.pwa-steps{

  background:#f1faf3;

  border:1px solid #d5eedb;

  border-radius:16px;

  padding:15px;

  text-align:left;

  color:#333;

  font-size:14px;

  line-height:1.65;

  margin-bottom:15px;
}

.pwa-steps strong{

  color:#2aa449;
}

.pwa-install{

  width:100%;

  border:none;

  border-radius:14px;

  padding:14px;

  background:#2aa449;

  color:#fff;

  font-size:16px;

  font-weight:900;

  cursor:pointer;

  margin-bottom:9px;

  -webkit-tap-highlight-color:transparent;
}

.pwa-install:hover{
  background:#218b3d;
}

.pwa-close{

  width:100%;

  border:1px solid #ddd;

  border-radius:14px;

  padding:12px;

  background:#fff;

  color:#555;

  font-size:14px;

  cursor:pointer;
}

.pwa-link{

  display:inline-block;

  margin-top:10px;

  color:#2aa449;

  font-size:13px;

  font-weight:bold;

  text-decoration:none;
}

/* =====================================================
   CELULAR
   ===================================================== */

@media(max-width:480px){

  header{
    padding-top:18px;
  }

  .logo{
    width:160px;
  }

  .radio-btn{
    width:68px;
    height:68px;
  }

  .title{
    font-size:21px;
  }

  .card{
    padding:18px 8px;
  }

  .iconBox{
    width:60px;
    height:60px;
  }

  .iconBox i{
    font-size:27px;
  }

  .pwa-popup{
    padding:21px 16px 16px;
  }

}

/* =====================================================
   TABLET / PC
   ===================================================== */

@media(min-width:700px){

  .google-search{
    padding-top:18px;
  }

  header{
    padding-top:28px;
  }

  .pwa-popup{
    max-width:460px;
  }

}

/* =====================================================
   SAFE AREA IPHONE
   ===================================================== */

@supports(padding:max(0px)){

  body{
    padding-bottom:max(0px, env(safe-area-inset-bottom));
  }

  .pwa-overlay{
    padding-top:max(18px, env(safe-area-inset-top));
    padding-bottom:max(18px, env(safe-area-inset-bottom));
  }

}

</style>

<!-- =====================================================
     JAVASCRIPT

<script>

/* =====================================================
   RÁDIO
   ===================================================== */

const radio = document.getElementById("radio");
const radioBtn = document.getElementById("radioBtn");
const radioIcon = radioBtn.querySelector("i");

radioBtn.addEventListener("click", async () => {

  try{

    if(radio.paused){

      await radio.play();

      radioIcon.classList.remove("fa-play");
      radioIcon.classList.add("fa-pause");

    }else{

      radio.pause();

      radioIcon.classList.remove("fa-pause");
      radioIcon.classList.add("fa-play");

    }

  }catch(error){

    console.log("Não foi possível iniciar a rádio:",error);

  }

});


/* =====================================================
   PWA — INSTALAÇÃO E ADAPTAÇÃO MULTINAVEGADOR
   ===================================================== */

let deferredPrompt = null;
let installEventReceived = false;

/* ---------- DETECÇÃO DE AMBIENTE ---------- */

function getUA(){
  return (navigator.userAgent || "").toLowerCase();
}

function isAndroid(){
  return /android/i.test(navigator.userAgent || "");
}

function isIOS(){
  return /iphone|ipad|ipod/i.test(navigator.userAgent || "") ||
         (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
}

function isStandalone(){
  return (
    window.matchMedia("(display-mode: standalone)").matches ||
    window.matchMedia("(display-mode: fullscreen)").matches ||
    window.navigator.standalone === true
  );
}

function isInAppBrowser(){
  const ua = getUA();

  return (
    ua.includes("instagram") ||
    ua.includes("fbav") ||
    ua.includes("fban") ||
    ua.includes("fb_iab") ||
    ua.includes("fb4a") ||
    ua.includes("fbiOS".toLowerCase()) ||
    ua.includes("messenger") ||
    ua.includes("line/") ||
    ua.includes("tiktok") ||
    ua.includes("twitter")
  );
}

function getBrowser(){
  const ua = getUA();

  if (isInAppBrowser()) return "inapp";
  if (ua.includes("samsungbrowser")) return "samsung";
  if (ua.includes("edg/")) return "edge";
  if (ua.includes("opr/") || ua.includes("opera")) return "opera";
  if (ua.includes("firefox") || ua.includes("fxios")) return "firefox";
  if (ua.includes("crios") || ua.includes("chrome")) return "chrome";
  if (ua.includes("safari")) return "safari";

  return "other";
}

/* ---------- ELEMENTOS ---------- */

const pwaOverlay = document.getElementById("pwaOverlay");
const pwaTitulo = document.getElementById("pwaTitulo");
const pwaTexto = document.getElementById("pwaTexto");
const pwaSteps = document.getElementById("pwaSteps");
const pwaInstall = document.getElementById("pwaInstall");
const pwaClose = document.getElementById("pwaClose");
const pwaStatus = document.getElementById("pwaStatus");

/* ---------- FUNÇÕES DE INTERFACE ---------- */

function mostrarStatus(mensagem){
  if(!pwaStatus) return;

  pwaStatus.innerHTML = mensagem;
  pwaStatus.style.display = "block";
}

function esconderStatus(){
  if(!pwaStatus) return;

  pwaStatus.style.display = "none";
  pwaStatus.innerHTML = "";
}

function mostrarBotaoInstalar(){
  if(pwaInstall){
    pwaInstall.style.display = "block";
  }
}

function esconderBotaoInstalar(){
  if(pwaInstall){
    pwaInstall.style.display = "none";
  }
}

/* ---------- CAPTURA DO PEDIDO NATIVO DE INSTALAÇÃO ---------- */

/*
   Chrome/Edge/Samsung Internet e outros navegadores compatíveis
   podem disparar este evento quando a página cumpre os requisitos
   de instalação do PWA.
*/
window.addEventListener("beforeinstallprompt", event => {

  event.preventDefault();

  deferredPrompt = event;
  installEventReceived = true;

  mostrarBotaoInstalar();

  mostrarStatus(
    "<strong>Instalação disponível:</strong> toque em <b>INSTALAR APLICATIVO</b> para adicionar o Estudo ao aparelho."
  );
});

/*
   Quando o navegador conclui a instalação.
*/
window.addEventListener("appinstalled", () => {

  deferredPrompt = null;
  installEventReceived = false;

  esconderBotaoInstalar();

  mostrarStatus(
    "<strong>Aplicativo instalado.</strong> O Estudo agora pode ser aberto pela tela inicial."
  );
});

/* ---------- CONTEÚDO POR NAVEGADOR ---------- */

function configurarInstrucoes(){

  const browser = getBrowser();

  esconderStatus();

  /* Facebook / Instagram / navegadores internos */
  if(browser === "inapp"){

    pwaTitulo.innerText = "Abra no navegador";

    pwaTexto.innerHTML =
      "O Facebook, Instagram e alguns aplicativos usam um navegador interno. A instalação deve ser feita no navegador do aparelho.";

    pwaSteps.innerHTML = `
      <strong>Como continuar:</strong><br><br>

      <b>1.</b> Abra o menu do navegador interno
      <b>⋮</b> ou procure por <b>“Abrir no navegador”</b>.<br><br>

      <b>2.</b> Escolha <b>Chrome</b>, <b>Safari</b> ou outro navegador externo disponível.<br><br>

      <b>3.</b> No navegador externo, espere a página carregar completamente.<br><br>

      <b>4.</b> Use o botão <b>INSTALAR APLICATIVO</b>, quando aparecer,
      ou siga a opção <b>Adicionar à tela inicial</b>.
    `;

    esconderBotaoInstalar();
    return;
  }

  /* iPhone / iPad */
  if(isIOS()){

    pwaTitulo.innerText = "Instale no iPhone ou iPad";

    pwaTexto.innerHTML =
      "No iPhone e iPad, a instalação é feita pelo menu de compartilhamento do navegador.";

    if(browser === "safari" || browser === "other" || browser === "chrome" || browser === "edge" || browser === "firefox" || browser === "opera"){

      pwaSteps.innerHTML = `
        <strong>No iPhone ou iPad:</strong><br><br>

        <b>1.</b> Abra esta página no <b>Safari</b> para a instalação mais compatível.<br><br>

        <b>2.</b> Toque em <b>Compartilhar</b>
        <span aria-hidden="true">⬆️</span>.<br><br>

        <b>3.</b> Procure <b>“Adicionar à Tela de Início”</b>.<br><br>

        <b>4.</b> Toque em <b>Adicionar</b>.<br><br>

        Depois, o ícone <b>Estudo</b> ficará disponível na tela inicial.
      `;

      mostrarStatus(
        "<strong>iPhone/iPad:</strong> se a opção não aparecer, abra esta página diretamente no Safari."
      );
    }

    esconderBotaoInstalar();
    return;
  }

  /* Android */
  if(isAndroid()){

    pwaTitulo.innerText = "Instale o aplicativo";

    pwaTexto.innerHTML =
      "Seu Android pode instalar o Estudo como aplicativo, sem precisar abrir o navegador toda vez.";

    if(installEventReceived){

      pwaSteps.innerHTML = `
        <strong>Instalação disponível neste navegador:</strong><br><br>

        Toque em <b>INSTALAR APLICATIVO</b> abaixo e confirme quando o navegador pedir.
      `;

      mostrarBotaoInstalar();
      return;
    }

    if(browser === "chrome"){

      pwaSteps.innerHTML = `
        <strong>Google Chrome no Android:</strong><br><br>

        <b>1.</b> Toque no menu <b>⋮</b> no canto superior direito.<br><br>

        <b>2.</b> Procure <b>“Instalar aplicativo”</b>,
        <b>“Instalar Estudo”</b> ou
        <b>“Adicionar à tela inicial”</b>.<br><br>

        <b>3.</b> Confirme a instalação.
      `;

    }else if(browser === "samsung"){

      pwaSteps.innerHTML = `
        <strong>Samsung Internet:</strong><br><br>

        <b>1.</b> Abra o menu <b>☰</b> ou o menu do navegador.<br><br>

        <b>2.</b> Procure <b>“Adicionar página à”</b>,
        <b>“Tela inicial”</b> ou a opção de instalação oferecida pelo navegador.<br><br>

        <b>3.</b> Confirme para criar o acesso na tela inicial.<br><br>

        Se o navegador oferecer <b>Instalar aplicativo</b>, use essa opção.
      `;

    }else if(browser === "edge"){

      pwaSteps.innerHTML = `
        <strong>Microsoft Edge no Android:</strong><br><br>

        <b>1.</b> Abra o menu do Edge.<br><br>

        <b>2.</b> Procure <b>“Adicionar ao telefone”</b>,
        <b>“Instalar aplicativo”</b> ou opção equivalente.<br><br>

        <b>3.</b> Confirme a instalação.
      `;

    }else if(browser === "opera"){

      pwaSteps.innerHTML = `
        <strong>Opera / Opera Mini:</strong><br><br>

        O suporte à instalação de PWA pode variar conforme a versão do navegador.<br><br>

        Se aparecer <b>Instalar</b> ou <b>Adicionar à tela inicial</b>,
        use essa opção.<br><br>

        Se não aparecer, abra o endereço no <b>Chrome</b> ou
        <b>Samsung Internet</b> e faça a instalação por lá.
      `;

    }else if(browser === "firefox"){

      pwaSteps.innerHTML = `
        <strong>Firefox:</strong><br><br>

        O suporte à instalação pode variar conforme o aparelho e a versão.<br><br>

        Procure no menu do navegador uma opção como
        <b>“Adicionar à tela inicial”</b>.<br><br>

        Se a opção de instalação não estiver disponível,
        abra a página no <b>Chrome</b> ou <b>Samsung Internet</b>.
      `;

    }else{

      pwaSteps.innerHTML = `
        <strong>Outros navegadores Android:</strong><br><br>

        Abra o menu do navegador e procure por
        <b>“Instalar aplicativo”</b>,
        <b>“Adicionar à tela inicial”</b> ou
        <b>“Adicionar à página inicial”</b>.<br><br>

        Se o navegador não oferecer essas opções,
        abra o site no <b>Chrome</b> ou <b>Samsung Internet</b>.
      `;

    }

    esconderBotaoInstalar();

    mostrarStatus(
      "<strong>Dica:</strong> o botão de instalação aparece automaticamente quando este navegador informa que o PWA está pronto para instalar."
    );

    return;
  }

  /* PC / Mac */
  pwaTitulo.innerText = "Instale o aplicativo";

  pwaTexto.innerHTML =
    "Você pode instalar o Estudo no computador e abrir em uma janela própria, como um aplicativo.";

  if(installEventReceived){

    pwaSteps.innerHTML = `
      <strong>Instalação disponível:</strong><br><br>

      Clique em <b>INSTALAR APLICATIVO</b> abaixo e confirme.
    `;

    mostrarBotaoInstalar();
    return;
  }

  if(browser === "chrome"){

    pwaSteps.innerHTML = `
      <strong>Google Chrome no PC:</strong><br><br>

      <b>1.</b> Procure o ícone de instalação
      <span aria-hidden="true">⊕</span> na barra de endereço,
      quando disponível.<br><br>

      <b>2.</b> Ou abra o menu <b>⋮</b>.<br><br>

      <b>3.</b> Escolha <b>“Instalar Estudo”</b> ou
      <b>“Instalar aplicativo”</b>.
    `;

  }else if(browser === "edge"){

    pwaSteps.innerHTML = `
      <strong>Microsoft Edge no PC:</strong><br><br>

      <b>1.</b> Procure o ícone de aplicativo/instalação na barra de endereço.<br><br>

      <b>2.</b> Ou abra o menu do Edge.<br><br>

      <b>3.</b> Procure <b>“Aplicativos”</b> →
      <b>“Instalar este site como aplicativo”</b>.
    `;

  }else if(browser === "safari"){

    pwaSteps.innerHTML = `
      <strong>Safari no Mac:</strong><br><br>

      Dependendo da versão do macOS, use o menu
      <b>Arquivo</b> → <b>Adicionar ao Dock</b>
      para transformar o site em um aplicativo.<br><br>

      Se essa opção não estiver disponível, mantenha o site salvo
      nos favoritos ou abra-o em um navegador compatível com instalação de PWA.
    `;

  }else if(browser === "firefox"){

    pwaSteps.innerHTML = `
      <strong>Firefox no PC:</strong><br><br>

      A instalação de PWA pode não estar disponível nesta versão do Firefox.<br><br>

      Para instalar como aplicativo, abra o Estudo no
      <b>Chrome</b> ou <b>Microsoft Edge</b>.
    `;

  }else{

    pwaSteps.innerHTML = `
      <strong>Seu navegador:</strong><br><br>

      Procure no menu uma opção como
      <b>Instalar aplicativo</b>,
      <b>Instalar este site</b> ou
      <b>Adicionar à tela inicial</b>.<br><br>

      Se essa opção não existir, abra o Estudo no
      <b>Chrome</b> ou <b>Microsoft Edge</b> para instalar como aplicativo.
    `;

  }

  esconderBotaoInstalar();

  mostrarStatus(
    "<strong>Importante:</strong> o botão de instalação só é exibido quando o navegador libera a instalação do PWA."
  );
}

/* ---------- ABERTURA DO POPUP ---------- */

function abrirPopupPWA(){

  /* Se já estiver instalado, não mostra popup */
  if(isStandalone()){
    return;
  }

  configurarInstrucoes();

  if(pwaOverlay){
    pwaOverlay.style.display = "flex";
  }
}

/* ---------- BOTÃO NATIVO DE INSTALAÇÃO ---------- */

if(pwaInstall){

  pwaInstall.addEventListener("click", async () => {

    if(!deferredPrompt){

      mostrarStatus(
        "<strong>Instalação ainda não liberada.</strong><br>Use as instruções acima ou abra o site no Chrome/Edge."
      );

      return;
    }

    try{

      deferredPrompt.prompt();

      const resultado = await deferredPrompt.userChoice;

      console.log("Instalação:", resultado.outcome);

      deferredPrompt = null;
      installEventReceived = false;

      esconderBotaoInstalar();

    }catch(error){

      console.log("Erro ao instalar PWA:", error);

    }

  });

}

/* ---------- FECHAR POPUP ---------- */

if(pwaClose){

  pwaClose.addEventListener("click", () => {

    if(pwaOverlay){
      pwaOverlay.style.display = "none";
    }

  });

}

/* ---------- FECHAR CLICANDO FORA ---------- */

if(pwaOverlay){

  pwaOverlay.addEventListener("click", function(event){

    if(event.target === this){
      this.style.display = "none";
    }

  });

}

/* ---------- ABRIR POPUP ---------- */

window.addEventListener("load", () => {

  setTimeout(() => {

    abrirPopupPWA();

  }, 700);

});

/* ---------- SERVICE WORKER ---------- */

if("serviceWorker" in navigator){

  window.addEventListener("load", () => {

    navigator.serviceWorker
      .register("./service-worker.js", {
        scope: "./"
      })
      .then(registration => {

        console.log(
          "Service Worker registrado:",
          registration.scope
        );

      })
      .catch(error => {

        console.log(
          "Erro no Service Worker:",
          error
        );

      });

  });

}


</script>
