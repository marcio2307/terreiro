<style>

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html{
  width:100%;
  min-height:100%;
}

body{
  font-family:Arial,sans-serif;
  background:#ffffff;
  min-height:100vh;
  min-height:100dvh;
  overflow-x:hidden;
  -webkit-text-size-adjust:100%;
}

/* =====================================================
   PESQUISA GOOGLE
   ===================================================== */

.google-search{
  display:flex;
  justify-content:center;
  width:100%;
  padding:10px 14px 0;
}

.google-search form{
  display:flex;
  width:100%;
  max-width:600px;
  height:46px;
}

.google-search input{
  flex:1;
  min-width:0;
  padding:0 16px;

  border:1px solid #d0d0d0;
  border-right:none;

  border-radius:24px 0 0 24px;

  outline:none;

  font-size:16px;

  box-shadow:0 2px 6px rgba(0,0,0,.10);

  -webkit-appearance:none;
  appearance:none;
}

.google-search input:focus{
  border-color:#2aa449;
  box-shadow:0 2px 8px rgba(42,164,73,.25);
}

.google-search button{
  width:58px;
  flex-shrink:0;

  border:none;

  border-radius:0 24px 24px 0;

  background:#2aa449;
  color:#fff;

  font-size:18px;

  cursor:pointer;

  box-shadow:0 2px 6px rgba(0,0,0,.10);

  -webkit-tap-highlight-color:transparent;
}

.google-search button:hover{
  background:#218b3d;
}

/* =====================================================
   CABEÇALHO
   ===================================================== */

header{
  text-align:center;
  padding:24px 10px 14px;
}

.logo{
  width:180px;
  max-width:70vw;
  height:auto;
  display:block;
  margin:0 auto 10px;
}

/* =====================================================
   PLAYER RÁDIO
   ===================================================== */

.radio-player{
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:10px;
  margin-bottom:12px;
}

.radio-btn{
  width:72px;
  height:72px;

  border-radius:50%;
  border:none;

  background:#2aa449;
  color:#ffffff;

  font-size:28px;

  cursor:pointer;

  display:flex;
  align-items:center;
  justify-content:center;

  box-shadow:0 6px 16px rgba(0,0,0,.25);

  transition:
    transform .15s ease,
    box-shadow .15s ease;

  -webkit-tap-highlight-color:transparent;
}

.radio-btn:hover{
  transform:scale(1.05);
  box-shadow:0 10px 22px rgba(0,0,0,.3);
}

.radio-btn:active{
  transform:scale(.96);
}

.radio-title{
  font-size:15px;
  font-weight:900;
  color:#2aa449;
}

.title{
  font-size:22px;
  font-weight:900;
  color:#2aa449;
}

/* =====================================================
   CARDS
   ===================================================== */

.wrap{
  padding:14px;
  width:100%;
  max-width:1200px;
  margin:auto;
}

.grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:12px;
}

@media(min-width:560px){

  .grid{
    grid-template-columns:repeat(3,1fr);
  }

}

@media(min-width:860px){

  .grid{
    grid-template-columns:repeat(4,1fr);
  }

}

.card{
  background:#2aa449;

  border-radius:18px;

  padding:20px 10px;

  display:flex;
  flex-direction:column;
  align-items:center;

  gap:12px;

  cursor:pointer;

  transition:
    transform .15s ease,
    box-shadow .15s ease;

  -webkit-tap-highlight-color:transparent;

  user-select:none;
}

.card:hover{
  transform:scale(1.03);
  box-shadow:0 10px 22px rgba(0,0,0,.15);
}

.card:active{
  transform:scale(.98);
}

.iconBox{
  width:64px;
  height:64px;

  border-radius:20px;

  background:rgba(255,255,255,.25);

  display:flex;
  align-items:center;
  justify-content:center;

  flex-shrink:0;
}

.iconBox i{
  font-size:30px;
  color:#ffffff;
}

.iconSvg{
  width:34px;
  height:34px;
}

.iconStroke{
  fill:none;
  stroke:#ffffff;
  stroke-width:2.6;
  stroke-linejoin:round;
  stroke-linecap:round;
}

.label{
  font-size:14px;
  font-weight:900;
  color:#ffffff;
  text-align:center;
}

/* =====================================================
   POPUP DE INSTALAÇÃO PWA
   ===================================================== */

.pwa-overlay{

  position:fixed;

  inset:0;

  width:100%;
  height:100%;

  background:rgba(0,0,0,.62);

  display:none;

  align-items:center;
  justify-content:center;

  padding:18px;

  z-index:99999;

  backdrop-filter:blur(4px);
  -webkit-backdrop-filter:blur(4px);
}

.pwa-popup{

  width:100%;
  max-width:430px;

  background:#ffffff;

  border-radius:24px;

  padding:24px 20px 20px;

  box-shadow:
    0 20px 60px rgba(0,0,0,.30);

  text-align:center;

  animation:pwaEntrada .25s ease;

  max-height:90vh;
  overflow-y:auto;
}

@keyframes pwaEntrada{

  from{
    opacity:0;
    transform:translateY(25px) scale(.96);
  }

  to{
    opacity:1;
    transform:translateY(0) scale(1);
  }

}

.pwa-icon{

  width:82px;
  height:82px;

  object-fit:contain;

  margin:0 auto 12px;

  border-radius:18px;

  box-shadow:0 5px 15px rgba(0,0,0,.15);
}

.pwa-popup h2{

  color:#2aa449;

  font-size:21px;

  margin-bottom:10px;

  font-weight:900;
}

.pwa-popup p{

  color:#444;

  font-size:15px;

  line-height:1.5;

  margin-bottom:14px;
}

.pwa-steps{

  background:#f1faf3;

  border:1px solid #d5eedb;

  border-radius:16px;

  padding:15px;

  text-align:left;

  color:#333;

  font-size:14px;

  line-height:1.65;

  margin-bottom:15px;
}

.pwa-steps strong{

  color:#2aa449;
}

.pwa-install{

  width:100%;

  border:none;

  border-radius:14px;

  padding:14px;

  background:#2aa449;

  color:#fff;

  font-size:16px;

  font-weight:900;

  cursor:pointer;

  margin-bottom:9px;

  -webkit-tap-highlight-color:transparent;
}

.pwa-install:hover{
  background:#218b3d;
}

.pwa-close{

  width:100%;

  border:1px solid #ddd;

  border-radius:14px;

  padding:12px;

  background:#fff;

  color:#555;

  font-size:14px;

  cursor:pointer;
}

.pwa-link{

  display:inline-block;

  margin-top:10px;

  color:#2aa449;

  font-size:13px;

  font-weight:bold;

  text-decoration:none;
}

/* =====================================================
   CELULAR
   ===================================================== */

@media(max-width:480px){

  header{
    padding-top:18px;
  }

  .logo{
    width:160px;
  }

  .radio-btn{
    width:68px;
    height:68px;
  }

  .title{
    font-size:21px;
  }

  .card{
    padding:18px 8px;
  }

  .iconBox{
    width:60px;
    height:60px;
  }

  .iconBox i{
    font-size:27px;
  }

  .pwa-popup{
    padding:21px 16px 16px;
  }

}

/* =====================================================
   TABLET / PC
   ===================================================== */

@media(min-width:700px){

  .google-search{
    padding-top:18px;
  }

  header{
    padding-top:28px;
  }

  .pwa-popup{
    max-width:460px;
  }

}

/* =====================================================
   SAFE AREA IPHONE
   ===================================================== */

@supports(padding:max(0px)){

  body{
    padding-bottom:max(0px, env(safe-area-inset-bottom));
  }

  .pwa-overlay{
    padding-top:max(18px, env(safe-area-inset-top));
    padding-bottom:max(18px, env(safe-area-inset-bottom));
  }

}


/* =====================================================
   VISUAL MODERNO — SOMENTE PC / DESKTOP
   Celular e tablet permanecem com o layout original.
   ===================================================== */

@media (min-width:1024px){

  html{
    background:#f4f7f5;
  }

  body{
    background:
      radial-gradient(circle at 50% 0%, rgba(42,164,73,.10), transparent 420px),
      #f4f7f5;
  }

  body::before{
    content:"";
    position:fixed;
    inset:0;
    pointer-events:none;
    background:linear-gradient(
      180deg,
      rgba(255,255,255,.75) 0,
      rgba(255,255,255,0) 260px
    );
    z-index:-1;
  }

  .google-search{
    padding:28px 20px 0;
  }

  .google-search form{
    max-width:620px;
    height:48px;
    border-radius:26px;
    box-shadow:
      0 4px 18px rgba(0,0,0,.08),
      0 1px 3px rgba(0,0,0,.06);
  }

  .google-search input{
    background:#fff;
    font-size:15px;
    border-color:#dfe5e1;
  }

  .google-search button{
    width:62px;
  }

  /* Cabeçalho transparente no PC:
     logo, rádio e título ficam diretamente sobre o fundo. */
  header{
    width:min(980px, calc(100% - 40px));
    margin:18px auto 0;
    padding:22px 20px 14px;
    background:transparent;
    border:none;
    border-radius:0;
    box-shadow:none;
  }

  .logo{
    width:142px;
    max-width:none;
    margin:0 auto 16px;
    border-radius:10px;
    box-shadow:none;
  }

  .radio-player{
    gap:7px;
    margin-bottom:10px;
  }

  .radio-btn{
    width:64px;
    height:64px;
    font-size:25px;
    box-shadow:0 8px 20px rgba(42,164,73,.25);
  }

  .radio-title{
    font-size:14px;
  }

  .title{
    margin-top:4px;
    font-size:25px;
    letter-spacing:.2px;
  }

  .wrap{
    width:100%;
    max-width:1020px;
    padding:26px 20px 50px;
  }

  /* PC: 3 colunas x 2 linhas.
     Assim Pontos Riscados fica exatamente abaixo de Baralho Cigano
     e os seis cards formam um conjunto perfeitamente centralizado. */
  .grid{
    width:100%;
    max-width:820px;
    margin:0 auto;
    grid-template-columns:repeat(3, 1fr);
    gap:16px;
    justify-content:center;
  }

  .card{
    min-height:156px;
    padding:22px 14px;
    border-radius:20px;
    background:linear-gradient(145deg, #2eae50, #249b43);
    box-shadow:
      0 7px 18px rgba(25,100,45,.12),
      inset 0 1px 0 rgba(255,255,255,.14);
  }

  .card:hover{
    transform:translateY(-5px);
    box-shadow:
      0 14px 28px rgba(25,100,45,.18),
      inset 0 1px 0 rgba(255,255,255,.16);
  }

  .iconBox{
    width:68px;
    height:68px;
    border-radius:20px;
    background:rgba(255,255,255,.22);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.18);
  }

  .iconBox i{
    font-size:29px;
  }

  .iconSvg{
    width:35px;
    height:35px;
  }

  .label{
    font-size:14px;
    letter-spacing:.1px;
  }

  .pwa-popup{
    max-width:470px;
  }
}

@media (min-width:1400px){

  .google-search form{
    max-width:650px;
  }

  header{
    width:980px;
  }

  .grid{
    max-width:820px;
  }
}

</style>

<script>

/* =====================================================
   RÁDIO
   ===================================================== */

const radio = document.getElementById("radio");
const radioBtn = document.getElementById("radioBtn");
const radioIcon = radioBtn.querySelector("i");

radioBtn.addEventListener("click", async () => {

  try{

    if(radio.paused){

      await radio.play();

      radioIcon.classList.remove("fa-play");
      radioIcon.classList.add("fa-pause");

    }else{

      radio.pause();

      radioIcon.classList.remove("fa-pause");
      radioIcon.classList.add("fa-play");

    }

  }catch(error){

    console.log("Não foi possível iniciar a rádio:",error);

  }

});


/* =====================================================
   PWA
   ===================================================== */

let deferredPrompt = null;


/* Detecta Android */

function isAndroid(){

  return /android/i.test(
    navigator.userAgent
  );

}


/* Detecta iPhone/iPad */

function isIOS(){

  return /iphone|ipad|ipod/i.test(
    navigator.userAgent
  );

}


/* Detecta navegador interno */

function isInAppBrowser(){

  const ua =
    navigator.userAgent.toLowerCase();

  return (
    ua.includes("instagram") ||
    ua.includes("fbav") ||
    ua.includes("fban") ||
    ua.includes("facebook") ||
    ua.includes("messenger")
  );

}


/* Detecta PWA instalado */

function isStandalone(){

  return (
    window.matchMedia(
      "(display-mode: standalone)"
    ).matches ||

    window.navigator.standalone === true
  );

}


/* =====================================================
   ANDROID / CHROME
   Captura o pedido de instalação
   ===================================================== */

window.addEventListener(
  "beforeinstallprompt",
  function(event){

    event.preventDefault();

    deferredPrompt = event;

    const installBtn =
      document.getElementById("pwaInstall");

    if(installBtn){

      installBtn.style.display =
        "block";

    }

  }
);


/* =====================================================
   POPUP
   ===================================================== */

function abrirPopupPWA(){

  /* Não mostra se já estiver instalado */

  if(isStandalone()){

    return;

  }


  const overlay =
    document.getElementById("pwaOverlay");

  const titulo =
    document.getElementById("pwaTitulo");

  const texto =
    document.getElementById("pwaTexto");

  const steps =
    document.getElementById("pwaSteps");

  const installBtn =
    document.getElementById("pwaInstall");


  overlay.style.display =
    "flex";


  /* =================================================
     FACEBOOK / INSTAGRAM
     ================================================= */

  if(isInAppBrowser()){

    titulo.innerText =
      "Abra no navegador";

    texto.innerHTML =
      "Você está acessando o site pelo navegador interno do Facebook ou Instagram.";

    steps.innerHTML = `

      <strong>Para instalar o aplicativo:</strong><br><br>

      1. Toque nos <b>três pontinhos ⋮</b> ou no menu do navegador.<br>

      2. Escolha <b>“Abrir no navegador”</b> ou
      <b>“Abrir no Chrome/Safari”</b>.<br>

      3. Quando o site abrir no navegador,
      siga as instruções de instalação.<br>

    `;

    installBtn.style.display =
      "none";

    return;

  }


  /* =================================================
     IPHONE / IPAD
     ================================================= */

  if(isIOS()){

    titulo.innerText =
      "Instale no iPhone ou iPad";

    texto.innerHTML =
      "Você pode colocar o Meu Terreiro na tela inicial e abrir como um aplicativo.";

    steps.innerHTML = `

      <strong>No Safari:</strong><br><br>

      1. Toque no botão
      <b>Compartilhar</b>
      <br>

      2. Role a lista para baixo.<br>

      3. Toque em
      <b>“Adicionar à Tela de Início”</b>.<br>

      4. Toque em
      <b>Adicionar</b>.<br><br>

      Depois o ícone <b>Meu Terreiro</b>
      aparecerá na tela do seu iPhone/iPad.

    `;

    installBtn.style.display =
      "none";

    return;

  }


  /* =================================================
     ANDROID
     ================================================= */

  if(isAndroid()){

    titulo.innerText =
      "Instale o Meu Terreiro";

    texto.innerHTML =
      "Instale o Meu Terreiro na tela inicial do seu Android para acessar rapidamente.";

    steps.innerHTML = `

      <strong>No Android:</strong><br><br>

      Se aparecer o botão abaixo,
      toque em <b>INSTALAR APLICATIVO</b>.<br><br>

      Se o botão não aparecer:<br>

      1. Abra o menu <b>⋮</b> do Chrome.<br>

      2. Procure por
      <b>“Instalar aplicativo”</b>
      ou
      <b>“Adicionar à tela inicial”</b>.<br>

      3. Confirme a instalação.

    `;

    return;

  }


  /* =================================================
     PC / OUTROS NAVEGADORES
     ================================================= */

  titulo.innerText =
    "Instale o Meu Terreiro";

  texto.innerHTML =
    "Você pode instalar o Meu Terreiro no seu computador quando o navegador oferecer essa opção.";

  steps.innerHTML = `

    <strong>No Chrome ou navegador compatível:</strong><br><br>

    Procure o ícone de
    <b>instalação</b>
    na barra de endereço ou abra o menu
    <b>⋮</b>.<br><br>

    Depois escolha
    <b>“Instalar Meu Terreiro”</b>.

  `;

}


/* =====================================================
   BOTÃO INSTALAR ANDROID / CHROME
   ===================================================== */

document
  .getElementById("pwaInstall")
  .addEventListener("click", async () => {

    if(!deferredPrompt){

      return;

    }

    deferredPrompt.prompt();

    const resultado =
      await deferredPrompt.userChoice;

    console.log(
      "Instalação:",
      resultado.outcome
    );

    deferredPrompt = null;

    document
      .getElementById("pwaInstall")
      .style.display =
      "none";

  });


/* =====================================================
   FECHAR POPUP
   ===================================================== */

document
  .getElementById("pwaClose")
  .addEventListener(
    "click",
    () => {

      document
        .getElementById("pwaOverlay")
        .style.display =
        "none";

    }
  );


/* =====================================================
   FECHA CLICANDO FORA
   ===================================================== */

document
  .getElementById("pwaOverlay")
  .addEventListener(
    "click",
    function(event){

      if(
        event.target === this
      ){

        this.style.display =
          "none";

      }

    }
  );


/* =====================================================
   MOSTRA O POPUP DEPOIS QUE A PÁGINA CARREGAR
   ===================================================== */

window.addEventListener(
  "load",
  () => {

    setTimeout(
      abrirPopupPWA,
      900
    );

  }
);


/* =====================================================
   SERVICE WORKER
   ===================================================== */

if(
  "serviceWorker" in navigator
){

  window.addEventListener(
    "load",
    () => {

      navigator.serviceWorker
        .register("./service-worker.js")
        .then(
          registration => {

            console.log(
              "Service Worker registrado:",
              registration.scope
            );

          }
        )
        .catch(
          error => {

            console.log(
              "Erro no Service Worker:",
              error
            );

          }
        );

    }
  );

}

</script>
