<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#ffffff">

<title>Imagens</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html,
body{
  width:100%;
  height:100%;
  overflow:hidden;
  background:#fff;
  font-family:Arial, sans-serif;
}

/* Área principal */
.viewer{
  position:relative;
  width:100vw;
  height:100dvh;
  background:#fff;
  overflow:hidden;
}

/* Sequência de imagens */
.slides{
  display:flex;
  width:100%;
  height:100%;
  overflow-x:auto;
  overflow-y:hidden;
  scroll-snap-type:x mandatory;
  scroll-behavior:smooth;
  -webkit-overflow-scrolling:touch;
  scrollbar-width:none;
  touch-action:pan-x;
}

.slides::-webkit-scrollbar{
  display:none;
}

/* Cada slide */
.slide{
  flex:0 0 100%;
  width:100%;
  height:100%;
  scroll-snap-align:start;
  scroll-snap-stop:always;

  display:flex;
  align-items:center;
  justify-content:center;

  padding:10px 42px;
  background:#fff;
}

/* Imagem */
.slide img{
  display:block;
  width:auto;
  height:auto;

  max-width:100%;
  max-height:100%;

  object-fit:contain;

  user-select:none;
  -webkit-user-drag:none;
}

/* =========================
   SETAS
========================= */

.arrow{
  position:absolute;

  top:50%;
  transform:translateY(-50%);

  width:48px;
  height:48px;

  border:0;
  border-radius:50%;

  background:rgba(42,164,73,.88);
  color:#fff;

  font-size:30px;
  line-height:48px;
  text-align:center;

  cursor:pointer;

  z-index:10;

  box-shadow:0 4px 12px rgba(0,0,0,.22);

  transition:
    transform .15s ease,
    background .15s ease;
}

.arrow:hover{
  background:#218b3d;
}

.arrow:active{
  transform:translateY(-50%) scale(.94);
}

.prev{
  left:10px;
}

.next{
  right:10px;
}

/* =========================
   INDICADORES
========================= */

.dots{
  position:absolute;

  left:50%;
  bottom:12px;

  transform:translateX(-50%);

  z-index:10;

  display:flex;
  gap:7px;

  padding:7px 10px;

  border-radius:20px;

  background:rgba(0,0,0,.18);

  backdrop-filter:blur(4px);
}

.dot{
  width:9px;
  height:9px;

  border-radius:50%;

  background:#fff;
  opacity:.55;

  cursor:pointer;
}

.dot.active{
  opacity:1;
  transform:scale(1.2);
}

/* =========================
   CONTADOR
========================= */

.counter{
  position:absolute;

  top:12px;
  left:50%;

  transform:translateX(-50%);

  z-index:10;

  padding:5px 11px;

  border-radius:16px;

  background:rgba(0,0,0,.18);

  color:#fff;

  font-size:13px;
  font-weight:bold;

  backdrop-filter:blur(4px);
}

/* =========================
   CELULAR
========================= */

@media (max-width:600px){

  .slide{
    padding:8px 34px;
  }

  .arrow{
    width:42px;
    height:42px;

    line-height:42px;
    font-size:26px;
  }

  .prev{
    left:6px;
  }

  .next{
    right:6px;
  }

  .dots{
    bottom:9px;
  }
}

/* =========================
   MENOS ANIMAÇÃO
========================= */

@media (prefers-reduced-motion:reduce){

  .slides{
    scroll-behavior:auto;
  }

}
</style>
</head>

<body>

<div class="viewer">

  <div class="slides" id="slides">

    <!-- =================================
         SLIDE 00
    ================================== -->
    <section class="slide">
      <img
        src="imagem%2000.png"
        alt="Imagem 00">
    </section>


    <!-- =================================
         SLIDE 01
    ================================== -->
    <section class="slide">
      <img
        src="imagem%2001.png"
        alt="Imagem 01">
    </section>


    <!-- =================================
         SLIDE 02
    ================================== -->
    <section class="slide">
      <img
        src="imagem%2002.png"
        alt="Imagem 02">
    </section>


    <!-- =================================
         SLIDE 03
    ================================== -->
    <section class="slide">
      <img
        src="imagem%2003.png"
        alt="Imagem 03">
    </section>


    <!-- =================================
         SLIDE 04
    ================================== -->
    <section class="slide">
      <img
        src="imagem%2004.png"
        alt="Imagem 04">
    </section>

  </div>


  <!-- =========================
       SETA ANTERIOR
  ========================== -->

  <button
    class="arrow prev"
    id="prev"
    aria-label="Imagem anterior">
    &#10094;
  </button>


  <!-- =========================
       SETA PRÓXIMA
  ========================== -->

  <button
    class="arrow next"
    id="next"
    aria-label="Próxima imagem">
    &#10095;
  </button>


  <!-- =========================
       CONTADOR
  ========================== -->

  <div
    class="counter"
    id="counter">
    1 / 5
  </div>


  <!-- =========================
       PONTINHOS
  ========================== -->

  <div
    class="dots"
    id="dots">

    <span
      class="dot active"
      data-index="0">
    </span>

    <span
      class="dot"
      data-index="1">
    </span>

    <span
      class="dot"
      data-index="2">
    </span>

    <span
      class="dot"
      data-index="3">
    </span>

    <span
      class="dot"
      data-index="4">
    </span>

  </div>

</div>


<script>

/* =========================
   ELEMENTOS
========================= */

const slides =
  document.getElementById('slides');

const slideItems =
  document.querySelectorAll('.slide');

const dots =
  document.querySelectorAll('.dot');

const counter =
  document.getElementById('counter');

const prev =
  document.getElementById('prev');

const next =
  document.getElementById('next');


/* Slide atual */

let current = 0;


/* =========================
   MOSTRAR SLIDE
========================= */

function showSlide(index){

  current = Math.max(
    0,
    Math.min(
      index,
      slideItems.length - 1
    )
  );

  slides.scrollTo({

    left:
      current *
      slides.clientWidth,

    behavior:'smooth'

  });

  updateUI();
}


/* =========================
   ATUALIZAR INTERFACE
========================= */

function updateUI(){

  /* Contador */

  counter.textContent =
    (current + 1) +
    ' / ' +
    slideItems.length;


  /* Pontinhos */

  dots.forEach((dot, i) => {

    dot.classList.toggle(
      'active',
      i === current
    );

  });


  /* Seta anterior */

  prev.style.visibility =
    current === 0
      ? 'hidden'
      : 'visible';


  /* Seta próxima */

  next.style.visibility =
    current === slideItems.length - 1
      ? 'hidden'
      : 'visible';

}


/* =========================
   BOTÃO ANTERIOR
========================= */

prev.addEventListener(
  'click',
  () => {

    showSlide(
      current - 1
    );

  }
);


/* =========================
   BOTÃO PRÓXIMO
========================= */

next.addEventListener(
  'click',
  () => {

    showSlide(
      current + 1
    );

  }
);


/* =========================
   PONTINHOS
========================= */

dots.forEach(dot => {

  dot.addEventListener(
    'click',
    () => {

      showSlide(
        Number(dot.dataset.index)
      );

    }
  );

});


/* =========================
   RODA DO MOUSE
========================= */

slides.addEventListener(
  'wheel',
  (event) => {

    event.preventDefault();

    if(
      Math.abs(event.deltaY) >
      Math.abs(event.deltaX)
    ){

      if(event.deltaY > 0){

        showSlide(
          current + 1
        );

      }else{

        showSlide(
          current - 1
        );

      }

    }else if(
      event.deltaX !== 0
    ){

      showSlide(
        current +
        (
          event.deltaX > 0
            ? 1
            : -1
        )
      );

    }

  },
  {
    passive:false
  }
);


/* =========================
   ARRASTAR / TOUCH
========================= */

let scrollTimer;

slides.addEventListener(
  'scroll',
  () => {

    clearTimeout(
      scrollTimer
    );

    scrollTimer =
      setTimeout(
        () => {

          const index =
            Math.round(
              slides.scrollLeft /
              slides.clientWidth
            );

          if(index !== current){

            current =
              Math.max(
                0,
                Math.min(
                  index,
                  slideItems.length - 1
                )
              );

            updateUI();

          }

        },
        80
      );

  }
);


/* =========================
   TECLADO
========================= */

document.addEventListener(
  'keydown',
  (event) => {

    if(
      event.key === 'ArrowRight' ||
      event.key === 'ArrowDown'
    ){

      showSlide(
        current + 1
      );

    }


    if(
      event.key === 'ArrowLeft' ||
      event.key === 'ArrowUp'
    ){

      showSlide(
        current - 1
      );

    }

  }
);


/* =========================
   REDIMENSIONAMENTO
========================= */

window.addEventListener(
  'resize',
  () => {

    slides.scrollTo({

      left:
        current *
        slides.clientWidth,

      behavior:'auto'

    });

  }
);


/* =========================
   INICIAR
========================= */

updateUI();

</script>

</body>
</html>
